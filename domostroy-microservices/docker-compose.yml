version: '3.8'

services:
  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-net

  orders-service:
    build: ./orders-service
    container_name: orders_service
    environment:
      - DB_HOST=db
      - DB_NAME=app
      - DB_USER=postgres
      - DB_PASS=1234
    depends_on:
      - db
    networks:
      - app-net

  notifications-service:
    build: ./notifications-service
    container_name: notifications_service
    networks:
      - app-net

  api-gateway:
    build: ./api-gateway
    container_name: api_gateway
    environment:
      - ORDERS_SERVICE_URL=http://orders-service:8002
      - NOTIF_SERVICE_URL=http://notifications-service:8003
    ports:
      - "8080:8080"
    depends_on:
      - orders-service
      - notifications-service
    networks:
      - app-net

volumes:
  db_data:

networks:
  app-net:
    driver: bridge
